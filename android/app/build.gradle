plugins { id 'com.android.application' }

android {
    namespace 'app.cleanframe.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'app.cleanframe.tv'
        applicationIdSuffix project.findProperty('idSuffix') ?: ''   // e.g. -PidSuffix=.shots installs beside the real app (screenshots)
        minSdk 26
        targetSdk 28   // personal sideload for Android 9, not Play
        versionCode 2
        versionName '1.0.0'
    }
    lint { disable 'ExpiredTargetSdkVersion' }
    buildTypes {
        // Debug-signed so a sideload build needs no keystore. Keep the same debug.keystore for updates.
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDirs = ['../../app']   // the shared CleanFrame UI, unchanged layout
    packagingOptions { resources.excludes += ['config.xml', 'icon.png'] }
}
